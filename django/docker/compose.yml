version: '3'
services:
  backend:
    build: 
      context: ../mercado
      target: builder  
    environment:
      - PORT=5050
    deploy:
      replicas: 4
    networks:
      - loadbalancing
  
  nginx:
    build: ../nginx
    ports:
      - "81:81"
    networks:
      - loadbalancing
    depends_on:
      - backend

networks:
  loadbalancing: